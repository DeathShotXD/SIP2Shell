<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 34" width="1200" height="34" role="img" aria-label="Section divider">
  <defs>
    <linearGradient id="dv" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d41414" stop-opacity="0"/>
      <stop offset=".28" stop-color="#d41414" stop-opacity=".75"/>
      <stop offset=".5" stop-color="#f0e2c8" stop-opacity=".45"/>
      <stop offset=".72" stop-color="#d41414" stop-opacity=".75"/>
      <stop offset="1" stop-color="#d41414" stop-opacity="0"/>
    </linearGradient>
    <filter id="dglow" x="-60%" y="-200%" width="220%" height="500%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <path d="M40 17 H540" stroke="url(#dv)" stroke-width="1.4"/>
  <path d="M660 17 H1160" stroke="url(#dv)" stroke-width="1.4" transform="scale(-1 1) translate(-1200 0)"/>

  <!-- packet ticks -->
  <g fill="#d41414" fill-opacity=".8">
    <rect x="516" y="15" width="6" height="4"/>
    <rect x="678" y="15" width="6" height="4"/>
  </g>

  <!-- centre mark: signal pulse through a diamond -->
  <g transform="translate(600 17)" filter="url(#dglow)">
    <path d="M-40 0 h16 l5 -9 l8 18 l6 -12 l4 3 h17" fill="none" stroke="#d41414" stroke-opacity=".9" stroke-width="1.4"/>
    <path d="M40 0 h-16 l-5 9 l-8 -18 l-6 12 l-4 -3 h-17" fill="none" stroke="#d41414" stroke-opacity=".9" stroke-width="1.4"/>
    <g transform="rotate(45)">
      <rect x="-8" y="-8" width="16" height="16" fill="#070607" stroke="#d41414" stroke-width="1.4"/>
      <rect x="-3" y="-3" width="6" height="6" fill="#f0e2c8" fill-opacity=".9"/>
    </g>
  </g>
</svg>
