<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="ftitle fdesc">
  <title id="ftitle">SIP2Shell attack chain: one SIP MESSAGE reaches the api chat protocol and switch_api_execute</title>
  <desc id="fdesc">Five stages map a single unauthenticated MESSAGE from mod_sofia through the api chat protocol to the system API and a root shell.</desc>
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070607"/>
      <stop offset=".52" stop-color="#090708"/>
      <stop offset="1" stop-color="#130607"/>
    </linearGradient>
    <linearGradient id="fconn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d41414" stop-opacity=".25"/>
      <stop offset=".5" stop-color="#ff2b2b" stop-opacity=".95"/>
      <stop offset="1" stop-color="#d41414" stop-opacity=".25"/>
    </linearGradient>
    <pattern id="fgrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0 L0 0 0 30" fill="none" stroke="#d41414" stroke-opacity=".05"/>
    </pattern>
    <pattern id="fdots" width="11" height="11" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r=".9" fill="#f0e2c8" fill-opacity=".035"/>
    </pattern>
    <filter id="fglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .kicker { font-size: 10.5px; letter-spacing: 2.2px; fill: #8a7a66; }
      .idx { font-size: 9.5px; letter-spacing: 1.6px; fill: #d41414; opacity: .85; }
      .nt { font-size: 14px; font-weight: 800; letter-spacing: .4px; fill: #f0e2c8; }
      .nc { font-size: 10.5px; letter-spacing: .2px; fill: #c9b89f; }
      .ns { font-size: 9.5px; letter-spacing: .6px; fill: #7d7062; }
      .band { font-size: 12.5px; font-weight: 700; letter-spacing: .5px; fill: #f0e2c8; }
      .bandk { font-size: 10.5px; font-weight: 800; letter-spacing: 2px; fill: #d41414; }
      .term { font-size: 11.5px; letter-spacing: .2px; }
      .flow { stroke-dasharray: 5 7; animation: fflow 1.9s linear infinite; }
      .pulse { animation: fpulse 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .blip { animation: fblip 3.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
      .blink { animation: fblink 1.15s steps(1) infinite; }
      @keyframes fflow { to { stroke-dashoffset: -48; } }
      @keyframes fpulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
      @keyframes fblip { 0% { transform: scale(.55); opacity: .6; } 80%,100% { transform: scale(2.1); opacity: 0; } }
      @keyframes fblink { 0%,49% { opacity: 1; } 50%,100% { opacity: .1; } }
      @media (prefers-reduced-motion: reduce) { .flow,.pulse,.blip,.blink { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="420" fill="url(#fbg)"/>
  <rect width="1200" height="420" fill="url(#fgrid)"/>
  <rect width="1200" height="420" fill="url(#fdots)"/>

  <text x="40" y="36" class="mono kicker" fill="#8a7a66">ATTACK CHAIN / CVE-2026-116779</text>
  <text x="1160" y="36" text-anchor="end" class="mono kicker" fill="#8a7a66">ONE UDP PACKET / NO CREDENTIALS</text>

  <!-- connectors -->
  <g stroke="url(#fconn)" stroke-width="1.6" fill="none">
    <path d="M232 126 H272" class="flow"/>
    <path d="M464 126 H504" class="flow"/>
    <path d="M696 126 H736" class="flow"/>
    <path d="M928 126 H968" class="flow"/>
  </g>
  <g fill="#d41414" fill-opacity=".9">
    <path d="M266 121 l6 5 l-6 5z"/>
    <path d="M498 121 l6 5 l-6 5z"/>
    <path d="M730 121 l6 5 l-6 5z"/>
    <path d="M962 121 l6 5 l-6 5z"/>
  </g>

  <!-- 01 -->
  <g transform="translate(40 70)">
    <rect width="192" height="112" rx="8" fill="#0d0809" stroke="#d41414" stroke-opacity=".34"/>
    <rect x="0" y="0" width="3" height="112" rx="1.5" fill="#d41414" opacity=".8"/>
    <text x="16" y="22" class="mono idx" fill="#d41414">01 / INBOUND</text>
    <text x="16" y="46" class="mono nt" fill="#f0e2c8">SIP MESSAGE</text>
    <text x="16" y="68" class="mono nc" fill="#c9b89f">sip:api+system%20id@...</text>
    <text x="16" y="88" class="mono ns" fill="#7d7062">UDP 5060 / no auth</text>
    <circle cx="176" cy="18" r="2.4" fill="#d41414" class="blip"/>
  </g>

  <!-- 02 -->
  <g transform="translate(272 70)">
    <rect width="192" height="112" rx="8" fill="#0c0808" stroke="#d41414" stroke-opacity=".28"/>
    <rect x="0" y="0" width="3" height="112" rx="1.5" fill="#d41414" opacity=".65"/>
    <text x="16" y="22" class="mono idx" fill="#d41414">02 / MOD_SOFIA</text>
    <text x="16" y="46" class="mono nt" font-size="12" fill="#f0e2c8">SOFIA PRESENCE</text>
    <text x="16" y="68" class="mono nc" fill="#c9b89f">split To user on "+"</text>
    <text x="16" y="88" class="mono ns" fill="#7d7062">left half = chat proto</text>
  </g>

  <!-- 03 -->
  <g transform="translate(504 70)">
    <rect width="192" height="112" rx="8" fill="#0d0809" stroke="#d41414" stroke-opacity=".34"/>
    <rect x="0" y="0" width="3" height="112" rx="1.5" fill="#d41414" opacity=".8"/>
    <text x="16" y="22" class="mono idx" fill="#d41414">03 / MOD_DPTOOLS</text>
    <text x="16" y="46" class="mono nt" fill="#f0e2c8">api CHAT PROTO</text>
    <text x="16" y="68" class="mono nc" fill="#c9b89f">url-decode the rest</text>
    <text x="16" y="88" class="mono ns" fill="#7d7062">no allow-list</text>
    <circle cx="176" cy="18" r="2.4" fill="#d41414" class="blip"/>
  </g>

  <!-- 04 -->
  <g transform="translate(736 70)">
    <rect width="192" height="112" rx="8" fill="#0c0808" stroke="#d41414" stroke-opacity=".28"/>
    <rect x="0" y="0" width="3" height="112" rx="1.5" fill="#d41414" opacity=".65"/>
    <text x="16" y="22" class="mono idx" fill="#d41414">04 / CORE</text>
    <text x="16" y="46" class="mono nt" font-size="12" fill="#f0e2c8">switch_api_execute</text>
    <text x="16" y="68" class="mono nc" fill="#c9b89f">system &lt;command&gt;</text>
    <text x="16" y="88" class="mono ns" fill="#7d7062">the fs_cli path</text>
  </g>

  <!-- 05 -->
  <g transform="translate(968 70)">
    <rect width="192" height="112" rx="8" fill="#0d0c08" stroke="#f0e2c8" stroke-opacity=".26"/>
    <rect x="0" y="0" width="3" height="112" rx="1.5" fill="#8ef07a" opacity=".8"/>
    <text x="16" y="22" class="mono idx" fill="#8ef07a">05 / RESULT</text>
    <text x="16" y="46" class="mono nt" fill="#f0e2c8">SHELL</text>
    <text x="16" y="68" class="mono nc" fill="#8ef07a">uid=0(root)</text>
    <text x="16" y="88" class="mono ns" fill="#7d7062">reply or OOB callback</text>
    <circle cx="176" cy="18" r="2.4" fill="#8ef07a" class="blip"/>
  </g>

  <!-- band -->
  <g transform="translate(40 210)">
    <rect width="1120" height="56" rx="8" fill="#d41414" fill-opacity=".05" stroke="#d41414" stroke-opacity=".24"/>
    <circle cx="22" cy="28" r="3.4" fill="#d41414" class="pulse"/>
    <text x="38" y="32" class="mono bandk" fill="#d41414">ONE PACKET</text>
    <text x="160" y="32" class="mono band" fill="#f0e2c8">No login. No user interaction. No module to load.</text>
    <text x="1100" y="32" text-anchor="end" class="mono kicker" fill="#8a7a66">UDP / 5060</text>
  </g>

  <!-- terminal -->
  <g transform="translate(40 294)">
    <rect width="1120" height="92" rx="9" fill="#080607" stroke="#d41414" stroke-opacity=".22"/>
    <path d="M0 26 H1120" stroke="#d41414" stroke-opacity=".18"/>
    <circle cx="20" cy="13" r="3.4" fill="#d41414" fill-opacity=".85"/>
    <circle cx="34" cy="13" r="3.4" fill="#f0b45a" fill-opacity=".6"/>
    <circle cx="48" cy="13" r="3.4" fill="#35d0c0" fill-opacity=".6"/>
    <text x="66" y="17" class="mono ns" fill="#7d7062">sip2shell / real lab</text>
    <text x="1100" y="17" text-anchor="end" class="mono ns" fill="#7d7062">1.10.12</text>
    <text x="20" y="50" class="mono term" fill="#b7a68e">$ python3 sip2shell.py exploit -t 10.0.0.5 -c "id"</text>
    <text x="20" y="76" class="mono term" fill="#8ef07a">uid=0(root) gid=0(root) groups=0(root)</text>
    <rect x="320" y="64" width="7" height="14" fill="#f0e2c8" class="blink"/>
    <text x="1100" y="76" text-anchor="end" class="mono ns" fill="#d41414">202 -&gt; RCE</text>
  </g>
</svg>
