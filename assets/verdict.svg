<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-labelledby="vtitle vdesc">
  <title id="vtitle">SIP2Shell status codes: 202 vulnerable, 403 patched, 401 or 407 auth wall, no answer</title>
  <desc id="vdesc">Four cards explain how to read the SIP status returned by a MESSAGE sent to api+ on FreeSWITCH.</desc>
  <defs>
    <linearGradient id="vbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070607"/>
      <stop offset=".55" stop-color="#0a0708"/>
      <stop offset="1" stop-color="#120607"/>
    </linearGradient>
    <pattern id="vgrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0 L0 0 0 28" fill="none" stroke="#d41414" stroke-opacity=".055"/>
    </pattern>
    <filter id="vglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .kicker { font-size: 11px; letter-spacing: 2.2px; }
      .code { font-size: 54px; font-weight: 800; letter-spacing: 1px; }
      .label { font-size: 12.5px; font-weight: 800; letter-spacing: 1.6px; }
      .body { font-size: 10.5px; letter-spacing: .2px; fill: #b7a68e; }
      .foot { font-size: 10px; letter-spacing: 1.1px; fill: #7d7062; }
      .pulse { animation: vp 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .blink { animation: vb 1.15s steps(1) infinite; }
      @keyframes vp { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
      @keyframes vb { 0%,49% { opacity: 1; } 50%,100% { opacity: .15; } }
      @media (prefers-reduced-motion: reduce) { .pulse,.blink { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="280" fill="url(#vbg)"/>
  <rect width="1200" height="280" fill="url(#vgrid)"/>

  <text x="40" y="36" class="mono kicker" fill="#8a7a66">READ THE STATUS CODE</text>
  <text x="1160" y="36" text-anchor="end" class="mono kicker" fill="#8a7a66">ONE MESSAGE / FOUR ANSWERS</text>

  <!-- 202 -->
  <g transform="translate(25 58)">
    <rect width="265" height="170" rx="9" fill="#0d0809" stroke="#d41414" stroke-opacity=".38"/>
    <rect width="265" height="3" rx="1.5" fill="#d41414"/>
    <circle cx="20" cy="25" r="3.4" fill="#d41414" class="pulse"/>
    <text x="34" y="29" class="mono kicker" fill="#d41414">VULNERABLE</text>
    <text x="20" y="100" class="mono code" fill="#f0e2c8" filter="url(#vglow)">202</text>
    <text x="20" y="126" class="mono label" fill="#d41414">MESSAGE ACCEPTED</text>
    <text x="20" y="146" class="mono body">the api chat proto ran the</text>
    <text x="20" y="160" class="mono body">command as the daemon</text>
  </g>

  <!-- 403 -->
  <g transform="translate(320 58)">
    <rect width="265" height="170" rx="9" fill="#080d0c" stroke="#35d0c0" stroke-opacity=".34"/>
    <rect width="265" height="3" rx="1.5" fill="#35d0c0"/>
    <circle cx="20" cy="25" r="3.4" fill="#35d0c0" class="pulse"/>
    <text x="34" y="29" class="mono kicker" fill="#35d0c0">PATCHED</text>
    <text x="20" y="100" class="mono code" fill="#f0e2c8">403</text>
    <text x="20" y="126" class="mono label" fill="#35d0c0">API PROTO REFUSED</text>
    <text x="20" y="146" class="mono body">enable-chat-api-proto is</text>
    <text x="20" y="160" class="mono body">off by default in 1.11.3+</text>
  </g>

  <!-- 401 / 407 -->
  <g transform="translate(615 58)">
    <rect width="265" height="170" rx="9" fill="#0d0b07" stroke="#f0b45a" stroke-opacity=".34"/>
    <rect width="265" height="3" rx="1.5" fill="#f0b45a"/>
    <circle cx="20" cy="25" r="3.4" fill="#f0b45a" class="pulse"/>
    <text x="34" y="29" class="mono kicker" fill="#f0b45a">AUTH WALL</text>
    <text x="20" y="100" class="mono code" fill="#f0e2c8" font-size="44">401/407</text>
    <text x="20" y="126" class="mono label" fill="#f0b45a">CREDENTIALS WANTED</text>
    <text x="20" y="146" class="mono body">the profile authenticates</text>
    <text x="20" y="160" class="mono body">MESSAGE; digest is handled</text>
  </g>

  <!-- no answer -->
  <g transform="translate(910 58)">
    <rect width="265" height="170" rx="9" fill="#0a0a0a" stroke="#5a5048" stroke-opacity=".42"/>
    <rect width="265" height="3" rx="1.5" fill="#5a5048"/>
    <circle cx="20" cy="25" r="3.4" fill="#7d7062"/>
    <text x="34" y="29" class="mono kicker" fill="#8a7a66">NO ANSWER</text>
    <text x="20" y="100" class="mono code" fill="#8a7a66">--</text>
    <text x="20" y="126" class="mono label" fill="#b7a68e">NOT FREESWITCH</text>
    <text x="20" y="146" class="mono body">filtered, TCP-only, or</text>
    <text x="20" y="160" class="mono body">the port is not 5060</text>
  </g>

  <text x="40" y="260" class="mono foot">A BARE 202 IS A LEAD, NOT A CONFIRMATION <tspan class="blink" fill="#d41414">_</tspan></text>
  <text x="1160" y="260" text-anchor="end" class="mono foot">SIP2SHELL / CVE-2026-116779</text>
</svg>
